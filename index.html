<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>25:00 · Pomodoro</title>
  <meta name="description" content="Temporizador Pomodoro minimalista con vídeo de fondo personalizable.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">

  <style>
    /* ===== 1. TOKENS ===== */
    :root {
      --ink: #f6eee6;
      --soft: rgba(246, 238, 230, .62);
      --glass: rgba(20, 12, 8, .38);
      --line: rgba(246, 238, 230, .16);
      --accent: #ffb36b;                       /* ámbar: Pomodoro */
      --dim: .5;                               /* oscurecimiento del fondo (ajustable) */
      --font: "Inter", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
      --radius: 14px;
      --ease: cubic-bezier(.4, 0, .2, 1);
    }
    body[data-mode="short"] { --accent: #a8d5b5; }   /* salvia */
    body[data-mode="long"]  { --accent: #9cc4e0; }   /* azul niebla */

    /* ===== 2. BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: #0d0c0b; color: var(--ink);
      font-family: var(--font); -webkit-font-smoothing: antialiased;
      text-shadow: 0 1px 14px rgba(0, 0, 0, .45);
      overflow: hidden;
    }
    button, input { font: inherit; color: inherit; }

    /* ===== 3. FONDO: degradado neutro / vídeo / YouTube + capa oscura ===== */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden;
      background: radial-gradient(ellipse at 50% 120%, #2b2724 0%, #151312 60%, #0d0c0b 100%); }
    .bg::after { content: ""; position: absolute; inset: 0; background: rgba(8, 4, 2, var(--dim)); transition: background .4s; }
    #media video, #media iframe { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: max(100vw, 177.78vh); height: max(56.25vw, 100vh); object-fit: cover; border: 0; pointer-events: none; }

    /* ===== 4. LAYOUT ===== */
    .app { display: flex; flex-direction: column; align-items: center; gap: clamp(24px, 5vh, 48px); width: 100%; max-width: 560px; }
    .app > *, .corner { transition: opacity .8s var(--ease); }

    .modes { display: flex; gap: 4px; padding: 4px; border-radius: var(--radius); background: var(--glass); backdrop-filter: blur(10px); }
    .mode-btn { padding: 8px 16px; border: 0; border-radius: 10px; background: transparent; color: var(--soft); font-size: .875rem; font-weight: 500; cursor: pointer; transition: background .3s, color .3s; }
    .mode-btn:hover { color: var(--ink); }
    .mode-btn[aria-selected="true"] { background: rgba(246, 238, 230, .14); color: var(--ink); }

    /* ===== 5. RELOJ ===== */
    .timer { text-align: center; }
    .time { display: block; font-size: clamp(5rem, 24vw, 10.5rem); font-weight: 300; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; transition: color .6s; }
    body.is-running .time { color: var(--accent); }
    .progress { width: min(280px, 70vw); height: 3px; margin: 26px auto 0; border-radius: 3px; background: var(--line); overflow: hidden; }
    #progress { height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .4s linear, background .6s; }

    /* Tarea actual: campo sin borde */
    .task { width: min(360px, 80vw); padding: 8px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: center; font-size: 1rem; outline: none; transition: border-color .3s, opacity .8s; }
    .task::placeholder { color: var(--soft); }
    .task:focus { border-color: var(--accent); }

    /* ===== 6. BOTONES ===== */
    .controls { display: flex; align-items: center; gap: 20px; }
    .icon-btn { display: grid; place-items: center; width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: var(--soft); cursor: pointer; transition: background .3s, color .3s; }
    .icon-btn:hover { background: var(--glass); color: var(--ink); }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn--main { width: 72px; height: 72px; background: var(--glass); color: var(--accent); backdrop-filter: blur(10px); }
    .icon-btn--main svg { width: 28px; height: 28px; fill: currentColor; stroke: none; }
    .icon-pause, .icon-sound-off { display: none; }
    body.is-muted .icon-sound-on { display: none; }
    body.is-muted .icon-sound-off { display: block; }
    body.is-running .icon-play { display: none; }
    body.is-running .icon-pause { display: block; }

    .corner { position: fixed; top: 16px; right: 16px; display: flex; gap: 4px; }
    .cycles { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--soft); font-size: .8125rem; }
    .dots { display: flex; gap: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .4s; }
    .dot.is-done { background: var(--accent); }

    /* Modo inmersivo: con el reloj en marcha, la interfaz se desvanece sin mover el ratón */
    body.idle { cursor: none; }
    body.idle .app > *:not(.timer), body.idle .corner { opacity: 0; pointer-events: none; }

    /* Alerta visual al llegar a cero */
    body.is-finished .time { animation: pulse 1.2s var(--ease) 3; }
    @keyframes pulse { 50% { opacity: .25; } }

    /* ===== 7. AJUSTES (dialog nativo) ===== */
    dialog { width: min(420px, 92vw); max-height: 88vh; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: rgba(24, 15, 10, .86); backdrop-filter: blur(18px); color: var(--ink); text-shadow: none; overflow: auto; margin: auto; }
    dialog::backdrop { background: rgba(0, 0, 0, .45); backdrop-filter: blur(3px); }
    dialog h2 { margin-bottom: 16px; font-size: 1.125rem; font-weight: 500; }
    fieldset { display: grid; gap: 12px; margin-bottom: 18px; padding: 0; border: 0; }
    legend { margin-bottom: 10px; color: var(--soft); font-size: .8125rem; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: .9375rem; }
    input[type="number"], input[type="text"] { width: 110px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, .05); }
    input[type="text"] { width: 100%; max-width: 230px; }
    input[type="range"] { width: 140px; accent-color: var(--accent); }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    .hint { color: var(--soft); font-size: .75rem; line-height: 1.5; }
    .row { display: flex; justify-content: space-between; margin-top: 8px; }
    .btn { padding: 9px 18px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; }
    .btn--fill { background: var(--accent); border-color: transparent; color: #1a0f08; font-weight: 500; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>

<body data-mode="pomodoro">
  <!-- Fondo: degradado neutro, o vídeo/iframe insertado por JS -->
  <div class="bg" aria-hidden="true">
    <div id="media"></div>
  </div>

  <!-- Botones de esquina -->
  <div class="corner">
    <button class="icon-btn" id="mute" type="button" aria-pressed="true" aria-label="Activar sonido del vídeo" title="Sonido del vídeo (M)">
      <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
    </button>
    <button class="icon-btn" id="fs" type="button" aria-label="Pantalla completa" title="Pantalla completa (F)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="open-settings" type="button" aria-label="Ajustes" title="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </button>
  </div>

  <main class="app">
    <nav class="modes" role="tablist" aria-label="Modo del temporizador">
      <button class="mode-btn" role="tab" data-mode="pomodoro" aria-selected="true">Pomodoro</button>
      <button class="mode-btn" role="tab" data-mode="short" aria-selected="false">Descanso corto</button>
      <button class="mode-btn" role="tab" data-mode="long" aria-selected="false">Descanso largo</button>
    </nav>

    <section class="timer" aria-label="Temporizador">
      <time class="time" id="time" aria-live="off">25:00</time>
      <div class="progress" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div>
    </section>

    <input class="task" id="task" type="text" maxlength="60" placeholder="¿En qué vas a trabajar?" aria-label="Tarea actual" autocomplete="off">

    <div class="controls">
      <button class="icon-btn" id="reset" type="button" aria-label="Reiniciar" title="Reiniciar (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="icon-btn icon-btn--main" id="toggle" type="button" aria-label="Iniciar o pausar" title="Iniciar / Pausar (Espacio)">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.5-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5Z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
      </button>
      <button class="icon-btn" id="skip" type="button" aria-label="Saltar al siguiente modo" title="Saltar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l9 7-9 7V5Z"/><path d="M19 5v14"/></svg>
      </button>
    </div>

    <footer class="cycles">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <span id="stats">0 pomodoros hoy</span>
    </footer>
  </main>

  <!-- Panel de ajustes: los campos se enlazan por el atributo name -->
  <dialog id="settings" aria-labelledby="st-title">
    <form method="dialog" id="form">
      <h2 id="st-title">Ajustes</h2>
      <fieldset>
        <legend>Duración (minutos)</legend>
        <label>Pomodoro <input type="number" name="work" min="1" max="180"></label>
        <label>Descanso corto <input type="number" name="short" min="1" max="60"></label>
        <label>Descanso largo <input type="number" name="long" min="1" max="120"></label>
      </fieldset>
      <fieldset>
        <legend>Ciclo</legend>
        <label>Pomodoros hasta el descanso largo <input type="number" name="interval" min="2" max="8"></label>
        <label>Iniciar automáticamente el siguiente <input type="checkbox" name="auto"></label>
      </fieldset>
      <fieldset>
        <legend>Sonido</legend>
        <label>Sonido al terminar <input type="checkbox" name="sound"></label>
        <label>Volumen de la campanilla <input type="range" name="volume" min="0" max="1" step=".05"></label>
      </fieldset>
      <fieldset>
        <legend>Fondo</legend>
        <label>Sonido del vídeo <input type="checkbox" name="videoSound"></label>
        <label>Volumen del vídeo <input type="range" name="videoVolume" min="0" max="1" step=".05"></label>
        <label>Oscurecer fondo <input type="range" name="dim" min="0" max=".9" step=".05"></label>
        <label>Vídeo <input type="text" name="video" placeholder="URL de YouTube o .mp4"></label>
        <p class="hint">Pega un enlace de YouTube o la dirección de un archivo de vídeo (.mp4, .webm). Se reproduce en bucle; el sonido empieza apagado. Déjalo vacío para usar el fondo predeterminado.</p>
      </fieldset>
      <div class="row">
        <button type="button" class="btn" id="restore">Restablecer</button>
        <button class="btn btn--fill">Listo</button>
      </div>
    </form>
  </dialog>

  <script>
  "use strict";

  /* ============================================================
     1. CONFIGURACIÓN Y PERSISTENCIA
     ============================================================ */
  /* ★ VÍDEO PREDETERMINADO ★
     Pega aquí un enlace de YouTube o la ruta de un .mp4 (por ejemplo "fondo.mp4").
     Déjalo vacío ("") para mostrar solo el fondo neutro.
     Cada usuario puede sustituirlo desde Ajustes → Vídeo. */
  const DEFAULT_VIDEO = "";

  const KEY = "pomodoro:v2";
  const LABELS = { pomodoro: "Pomodoro", short: "Descanso corto", long: "Descanso largo" };
  const DEFAULTS = { work: 25, short: 5, long: 15, interval: 4, auto: false, sound: true, volume: 0.5, videoSound: false, videoVolume: 0.5, dim: 0.5, video: "" };

  const Store = {
    today: () => new Date().toISOString().slice(0, 10),
    load() {
      const base = { mode: "pomodoro", completed: 0, minutes: 0, date: this.today(), task: "", settings: {} };
      try {
        const d = { ...base, ...JSON.parse(localStorage.getItem(KEY)) };
        d.settings = { ...DEFAULTS, ...d.settings };
        if (!LABELS[d.mode]) d.mode = "pomodoro";
        if (d.date !== this.today()) { d.completed = 0; d.minutes = 0; d.date = this.today(); }  // nuevo día
        return d;
      } catch { return { ...base, settings: { ...DEFAULTS } }; }
    },
    save() {
      try {
        localStorage.setItem(KEY, JSON.stringify({ mode: state.mode, completed: state.completed, minutes: state.minutes,
          date: this.today(), task: el.task.value, settings }));
      } catch { /* sin persistencia */ }
    },
  };

  const $ = (id) => document.getElementById(id);
  const el = { time: $("time"), progress: $("progress"), bar: document.querySelector(".progress"), task: $("task"),
    dots: $("dots"), stats: $("stats"), tabs: document.querySelectorAll(".mode-btn"), dialog: $("settings"), form: $("form") };

  const saved = Store.load();
  let settings = saved.settings;
  const durationMs = (mode) => settings[mode === "pomodoro" ? "work" : mode] * 60_000;

  const state = { mode: saved.mode, completed: saved.completed, minutes: saved.minutes,
    remaining: 0, running: false, endAt: 0, intervalId: null };
  state.remaining = durationMs(state.mode);
  el.task.value = saved.task;

  /* ============================================================
     2. SONIDO (Web Audio): campanilla suave sin archivos externos
     ============================================================ */
  const Snd = {
    ctx: null,

    unlock() {   // el navegador exige un gesto del usuario
      this.ctx ??= new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
    },

    chime() {
      if (!this.ctx || !settings.sound) return;
      [660, 880].forEach((f, i) => {
        const t = this.ctx.currentTime + i * 0.35, o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.01 + 0.35 * settings.volume, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
        o.connect(g).connect(this.ctx.destination);
        o.start(t); o.stop(t + 1.3);
      });
    },

  };

  /* ============================================================
     3. FONDO: vídeo de YouTube o archivo de vídeo, siempre en bucle y mudo.
     Sin URL (ni predeterminada ni del usuario) se queda el degradado neutro.
     ============================================================ */
  const Bg = {
    host: $("media"),
    media: null,   // <video> o <iframe> actual

    // Aplica sonido y volumen al vídeo; empieza siempre silenciado porque los navegadores bloquean el audio automático
    applySound() {
      const m = this.media, on = settings.videoSound, vol = settings.videoVolume;
      if (!m) return;
      if (m.tagName === "VIDEO") {
        m.volume = vol; m.muted = !on;
        if (on) m.play().catch(() => { m.muted = true; });   // si el navegador lo impide, sigue mudo
      } else {   // YouTube: se controla con mensajes a su API
        const cmd = (func, args = []) => m.contentWindow?.postMessage(JSON.stringify({ event: "command", func, args }), "*");
        if (on) { cmd("unMute"); cmd("setVolume", [Math.round(vol * 100)]); } else cmd("mute");
      }
    },

    set(url) {
      this.host.innerHTML = "";
      this.media = null;
      url = (url || "").trim() || DEFAULT_VIDEO;
      if (!url) return;

      const yt = url.match(/(?:youtu\.be\/|v=|embed\/|live\/)([\w-]{11})/);
      if (yt) {
        // YouTube rechaza (error 153) los embeds sin origen: no funcionan abriendo el archivo con file://
        if (location.protocol === "file:") { console.warn("YouTube necesita http(s): usa GitHub Pages o un servidor local."); return; }
        const f = document.createElement("iframe");
        f.src = `https://www.youtube-nocookie.com/embed/${yt[1]}?autoplay=1&mute=1&controls=0&loop=1&playlist=${yt[1]}&modestbranding=1&playsinline=1&rel=0&enablejsapi=1`;
        f.referrerPolicy = "strict-origin-when-cross-origin";   // imprescindible para que YouTube acepte el embed
        f.allow = "autoplay; encrypted-media"; f.title = "Vídeo de fondo"; f.tabIndex = -1;
        f.addEventListener("load", () => setTimeout(() => this.applySound(), 800));
        this.host.append(f); this.media = f;
        return;
      }

      const v = document.createElement("video");
      Object.assign(v, { src: url, loop: true, muted: true, autoplay: true, playsInline: true });
      v.addEventListener("error", () => v.remove());   // si el archivo no existe, queda el fondo neutro
      v.addEventListener("loadeddata", () => this.applySound());
      this.host.append(v); this.media = v;
    },
  };

  /* ============================================================
     4. RENDER
     ============================================================ */
  const pad = (n) => String(n).padStart(2, "0");

  function render() {
    const secs = Math.ceil(state.remaining / 1000), text = `${pad(Math.floor(secs / 60))}:${pad(secs % 60)}`;
    el.time.textContent = text;
    el.time.dateTime = `PT${Math.floor(secs / 60)}M${secs % 60}S`;
    document.title = `${text} · ${LABELS[state.mode]}`;

    const done = 1 - state.remaining / durationMs(state.mode);
    el.progress.style.transform = `scaleX(${done})`;
    el.bar.setAttribute("aria-valuenow", Math.round(done * 100));

    document.body.dataset.mode = state.mode;
    document.body.classList.toggle("is-running", state.running);
    el.tabs.forEach((t) => t.setAttribute("aria-selected", t.dataset.mode === state.mode));

    const inCycle = state.completed % settings.interval;
    el.dots.innerHTML = Array.from({ length: settings.interval }, (_, i) => `<span class="dot${i < inCycle ? " is-done" : ""}"></span>`).join("");
    const h = Math.floor(state.minutes / 60), m = state.minutes % 60;
    el.stats.textContent = `${state.completed} ${state.completed === 1 ? "pomodoro" : "pomodoros"} hoy · ${h ? h + " h " : ""}${m} min de foco`;
  }

  /* ============================================================
     5. LÓGICA DEL TEMPORIZADOR (basada en hora de fin, no en suma de ticks)
     ============================================================ */
  function tick() {
    state.remaining = Math.max(0, state.endAt - Date.now());
    render();
    if (state.remaining === 0) finish();
  }

  function start() {
    if (state.running) return;
    Snd.unlock();
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
    document.body.classList.remove("is-finished");
    state.running = true;
    state.endAt = Date.now() + state.remaining;
    state.intervalId = setInterval(tick, 250);
    render(); wake();
  }

  function pause() {
    if (!state.running) return;
    state.remaining = Math.max(0, state.endAt - Date.now());
    state.running = false;
    clearInterval(state.intervalId);
    document.body.classList.remove("idle");
    render();
  }

  function setMode(mode) {
    pause();
    state.mode = mode;
    state.remaining = durationMs(mode);
    document.body.classList.remove("is-finished");
    Store.save(); render();
  }

  const reset = () => setMode(state.mode);
  const skip = () => setMode(state.mode === "pomodoro" ? "short" : "pomodoro");

  function finish() {
    const wasWork = state.mode === "pomodoro";
    Snd.chime();
    if (document.hidden && "Notification" in window && Notification.permission === "granted")
      new Notification(wasWork ? "Pomodoro completado" : "Vuelve al trabajo", { body: wasWork ? "Toca descansar." : "El descanso ha terminado." });

    if (wasWork) { state.completed++; state.minutes += settings.work; }
    setMode(wasWork ? (state.completed % settings.interval === 0 ? "long" : "short") : "pomodoro");
    document.body.classList.add("is-finished");   // alerta visual
    if (settings.auto) start();
  }

  /* ============================================================
     6. AJUSTES
     ============================================================ */
  // Refleja en el botón (icono, etiqueta y estado ARIA) si el vídeo tiene sonido
  function renderSound() {
    document.body.classList.toggle("is-muted", !settings.videoSound);
    const b = $("mute");
    b.setAttribute("aria-pressed", settings.videoSound);
    b.setAttribute("aria-label", settings.videoSound ? "Silenciar vídeo" : "Activar sonido del vídeo");
  }

  // Activa o silencia el vídeo de fondo (el clic cuenta como gesto del usuario, así el navegador permite el audio)
  function toggleSound() {
    settings.videoSound = !settings.videoSound;
    Bg.applySound();
    syncForm(); renderSound(); Store.save();
  }

  function applySettings(fromUser) {
    document.documentElement.style.setProperty("--dim", settings.dim);
    if (fromUser) Snd.unlock();
    if (!state.running) state.remaining = durationMs(state.mode);
    Bg.applySound(); renderSound(); render(); Store.save();
  }

  // Rellena el formulario con los valores actuales
  function syncForm() {
    for (const f of el.form.elements) {
      if (!f.name) continue;
      f.type === "checkbox" ? (f.checked = settings[f.name]) : (f.value = settings[f.name]);
    }
  }

  // Cada cambio se aplica al instante
  el.form.addEventListener("input", (e) => {
    const f = e.target;
    if (!f.name) return;
    if (f.type === "checkbox") settings[f.name] = f.checked;
    else if (f.type === "text") { settings[f.name] = f.value; if (e.type === "change") Bg.set(f.value); }
    else if (f.value !== "" && f.checkValidity()) settings[f.name] = +f.value;
    applySettings(true);
  });
  el.form.addEventListener("change", (e) => { if (e.target.name === "video") Bg.set(settings.video); });

  $("restore").addEventListener("click", () => { settings = { ...DEFAULTS }; syncForm(); Bg.set(""); applySettings(true); });
  $("open-settings").addEventListener("click", () => { syncForm(); el.dialog.showModal(); });

  /* ============================================================
     7. EVENTOS, MODO INMERSIVO Y ATAJOS
     ============================================================ */
  $("toggle").addEventListener("click", () => (state.running ? pause() : start()));
  $("reset").addEventListener("click", reset);
  $("skip").addEventListener("click", skip);
  el.tabs.forEach((t) => t.addEventListener("click", () => setMode(t.dataset.mode)));
  el.task.addEventListener("input", () => Store.save());

  const toggleFullscreen = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
  $("fs").addEventListener("click", toggleFullscreen);
  $("mute").addEventListener("click", toggleSound);

  // Atenúa la interfaz tras 4 s sin actividad mientras corre el reloj
  let idleTimer;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => state.running && document.body.classList.add("idle"), 4000);
  }
  ["mousemove", "pointerdown", "keydown", "touchstart"].forEach((ev) => addEventListener(ev, wake, { passive: true }));

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, button, dialog")) return;   // no interferir al escribir
    if (e.code === "Space") { e.preventDefault(); state.running ? pause() : start(); }
    else if (e.key.toLowerCase() === "r") reset();
    else if (e.key.toLowerCase() === "f") toggleFullscreen();
    else if (e.key.toLowerCase() === "m") toggleSound();
  });

  document.addEventListener("visibilitychange", () => state.running && tick());

  /* ============================================================
     8. INICIO
     ============================================================ */
  Bg.set(settings.video);
  renderSound();
  ["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => settings.videoSound && Bg.applySound(), { once: true }));
  document.documentElement.style.setProperty("--dim", settings.dim);
  render();
  </script>
</body>
</html>
